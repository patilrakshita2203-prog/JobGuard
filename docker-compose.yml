# docker compose up --build
#   API        -> http://localhost:8000/docs
#   Dashboard  -> http://localhost:8501   (talks to the API over the compose network)
services:
  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JOBGUARD_API_KEY: ${JOBGUARD_API_KEY:-}
      JOBGUARD_CORS_ORIGINS: ${JOBGUARD_CORS_ORIGINS:-http://localhost:8501}
    ports:
      - "8000:8000"
    volumes:
      - jobguard-data:/app/data
    restart: unless-stopped

  dashboard:
    build: .
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      JOBGUARD_API_URL: http://api:8000
      JOBGUARD_API_KEY: ${JOBGUARD_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JOBGUARD_ENABLE_SCRAPING: "false"   # no Chrome inside the container
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  jobguard-data:
